<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split the bill</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; }
  input { display: block; width: 100%; padding: 0.4rem; margin-top: 0.25rem; box-sizing: border-box; }
  #error { color: #b00020; margin-top: 1rem; font-weight: 600; }
  #error[hidden] { display: none; }
  #results[hidden] { display: none; }
  #results { margin-top: 1.5rem; border-top: 1px solid #ccc; padding-top: 1rem; }
  #perPersonList { padding-left: 1.2rem; }
  #perPersonList li { margin: 0.25rem 0; }
</style>
</head>
<body>
<h1>Split the bill</h1>

<label for="billAmount">Bill amount</label>
<input id="billAmount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00">

<label for="numPeople">Number of people</label>
<input id="numPeople" type="number" step="1" min="0" inputmode="numeric" placeholder="1">

<label for="tipPercent">Tip percent</label>
<input id="tipPercent" type="number" step="1" min="0" inputmode="numeric" placeholder="0">

<p id="error" role="alert" hidden></p>

<div id="results" hidden>
  <p id="totalDisplay"></p>
  <ul id="perPersonList"></ul>
</div>

<script>
  const billAmount = document.getElementById('billAmount');
  const numPeople = document.getElementById('numPeople');
  const tipPercent = document.getElementById('tipPercent');
  const errorEl = document.getElementById('error');
  const resultsEl = document.getElementById('results');
  const totalDisplay = document.getElementById('totalDisplay');
  const perPersonList = document.getElementById('perPersonList');

  function hideError() {
    errorEl.hidden = true;
    errorEl.textContent = '';
  }

  function showError(message) {
    errorEl.hidden = false;
    errorEl.textContent = message;
  }

  function hideResults() {
    resultsEl.hidden = true;
    totalDisplay.textContent = '';
    perPersonList.innerHTML = '';
  }

  function recalc() {
    const billRaw = billAmount.value.trim();
    const peopleRaw = numPeople.value.trim();
    const tipRaw = tipPercent.value.trim();

    if (billRaw === '' && peopleRaw === '') {
      hideError();
      hideResults();
      return;
    }

    const people = peopleRaw === '' ? NaN : parseInt(peopleRaw, 10);

    if (peopleRaw !== '' && (isNaN(people) || people < 1)) {
      showError('At least 1 person is needed.');
      hideResults();
      return;
    }

    const bill = billRaw === '' ? 0 : parseFloat(billRaw);
    const tip = tipRaw === '' ? 0 : (parseFloat(tipRaw) || 0);

    if (isNaN(bill) || peopleRaw === '') {
      hideError();
      hideResults();
      return;
    }

    hideError();

    const total = bill * (1 + tip / 100);
    const totalCents = Math.round(total * 100);
    const baseCents = Math.floor(totalCents / people);
    const remainder = totalCents - baseCents * people;

    const amounts = [];
    for (let i = 0; i < people; i++) {
      const cents = baseCents + (i < remainder ? 1 : 0);
      amounts.push(cents / 100);
    }

    totalDisplay.textContent = 'Total: $' + total.toFixed(2);
    perPersonList.innerHTML = '';
    amounts.forEach((amount, i) => {
      const li = document.createElement('li');
      li.textContent = 'Person ' + (i + 1) + ' pays $' + amount.toFixed(2);
      perPersonList.appendChild(li);
    });
    resultsEl.hidden = false;
  }

  billAmount.addEventListener('input', recalc);
  numPeople.addEventListener('input', recalc);
  tipPercent.addEventListener('input', recalc);
</script>
</body>
</html>
